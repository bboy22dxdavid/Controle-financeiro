services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: financeiro
      POSTGRES_USER: financeiro
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-financeiro-local}
    ports:
      - "5432:5432"
    volumes:
      - financeiro-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financeiro -d financeiro"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://database:5432/financeiro
      DATABASE_USER: financeiro
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-financeiro-local}
      CORS_ALLOWED_ORIGINS: http://localhost:4200
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy

volumes:
  financeiro-data: