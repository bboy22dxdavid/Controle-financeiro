spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/financeiro}
    username: ${DATABASE_USER:financeiro}
    password: ${DATABASE_PASSWORD:financeiro-local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}